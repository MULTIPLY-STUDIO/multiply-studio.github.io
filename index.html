<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="preload" href="./src/assets/fonts/MultiplyBrush-Subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/fonts/MultiplyHan-Subset.woff2" as="font" type="font/woff2" crossorigin />
    <title>MULTIPLY 正片叠底</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
      }
    </style>
    <noscript>
      <style>
        #boot {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="boot"></div>
    <div id="app"></div>
    <script>
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (boot) boot.remove()
      }, 3000)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
